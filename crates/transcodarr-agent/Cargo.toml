[package]
name = "transcodarr-agent"
version = "0.1.0"
description = "transcodarr worker agent: environment preflight, capability probing, ffmpeg execution, commit ritual."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

# Depends on core only. Never on transcodarr-store: an agent must be copyable to
# the Windows node without dragging SQLite along.
[dependencies]
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
transcodarr-core = { path = "../transcodarr-core" }

[dev-dependencies]
tempfile = { workspace = true }
