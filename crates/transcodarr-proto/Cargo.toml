# file: crates/transcodarr-proto/Cargo.toml
# version: 1.2.0
# guid: 5a71e0c4-836b-4d92-a017-4f2c95e18b60
# last-edited: 2026-08-16

[package]
name = "transcodarr-proto"
version = "0.1.0"
description = "transcodarr agent protocol: message types, version gate, conversions."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# blake3 and tokio arrive with `transfer`, which lives here rather than in the
# server because both ends of a stream transfer need the *same* `Sink`. A copy
# in the agent would be a second implementation of the one gate that stands
# between a truncated transfer and an installed corrupt file.
blake3 = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
transcodarr-core = { path = "../transcodarr-core" }

[build-dependencies]
# protoc comes from the dependency tree rather than the machine -- see the note
# in the workspace manifest.
prost-build = { workspace = true }
protoc-bin-vendored = { workspace = true }
tonic-build = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
