[workspace]
# file: Cargo.toml
# version: 1.1.0
# guid: 4f8b1d27-3a60-4c95-b1e8-7d02a6f39c14
# last-edited: 2026-08-04
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
# Promotes the README's prose recommendation to an enforced MSRV.
rust-version = "1.76"
repository = "https://github.com/falkcorp/transcodarr"
homepage = "https://github.com/falkcorp/transcodarr"

# Declared workspace-wide so later phases reference `workspace = true` rather
# than re-pinning. A dependency listed here costs nothing until a member uses it.
[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
blake3 = "1"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "signal",
  "sync",
  "fs",
  "time",
] }
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
tonic-build = "0.12"
# The generated code is built with a protoc carried in the dependency tree
# rather than one installed on the machine. prost-build stopped bundling protoc
# at 0.11, and requiring it out-of-band makes the build depend on how a runner
# happens to be provisioned -- which is the sort of thing that works on a
# laptop and fails on a fresh CI image.
protoc-bin-vendored = "3"
prost-build = "0.13"
axum = "0.7"
tower-http = { version = "0.6", features = ["trace", "compression-gzip"] }
rust-embed = { version = "8" }
rusqlite = { version = "0.32", features = [
  "bundled",
  "serde_json",
  "blob",
  "backup",
] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
arc-swap = "1"
walkdir = "2"
rustls = "0.23"
humantime-serde = "1"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
