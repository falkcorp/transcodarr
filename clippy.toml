# Clippy configuration for Rust linting
# Following Rust best practices and performance guidelines
#
# Every key below is validated against clippy 0.1.97. Clippy rejects its whole
# config file on a single unknown key, so a stale name here does not degrade
# gracefully -- it disables linting entirely.

# Cognitive complexity threshold
# (cyclomatic-complexity-threshold is a deprecated alias for this key; setting
# both is a duplicate-field error, not an override.)
cognitive-complexity-threshold = 25

# Documentation requirements
missing-docs-in-crate-items = true

# Avoid certain patterns
avoid-breaking-exported-api = true
disallowed-methods = [
    "std::env::set_var",  # Prefer safer alternatives
    "std::process::exit", # Use proper error handling
]

# Type complexity threshold
type-complexity-threshold = 250

# Vector initialization threshold
vec-box-size-threshold = 4096

# Arithmetic side effects
arithmetic-side-effects-allowed = ["Size", "Offset"]

# Enum variant size threshold
enum-variant-size-threshold = 200

# Error type size threshold (was: large-error-types-threshold)
large-error-threshold = 128

# Future size threshold (was: large-futures-threshold)
future-size-threshold = 16384

# Stack array size threshold (was: large-stack-arrays-threshold)
too-large-for-stack = 512000

# By-value parameter size limit (was: large-types-passed-by-value-threshold)
pass-by-value-size-limit = 256

# Literal representation threshold
literal-representation-threshold = 10

# Maximum trait bounds
max-trait-bounds = 3

# Maximum bool parameters before a struct is warranted
max-fn-params-bools = 3

# Trivial copy size limit
trivial-copy-size-limit = 8

# Upper case acronyms aggressive
upper-case-acronyms-aggressive = false

# Verbose bit mask threshold
verbose-bit-mask-threshold = 1
